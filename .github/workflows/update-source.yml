name: Update SideStore source

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to add
        required: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Download IPA from release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release view "$TAG" --json body --jq .body > notes.txt
          ASSET=$(gh release view "$TAG" --json assets --jq '[.assets[] | select(.name | endswith(".ipa"))][0].name')
          if [ -z "$ASSET" ]; then echo "No .ipa asset on release $TAG"; exit 1; fi
          gh release download "$TAG" --pattern "$ASSET" --output app.ipa
          echo "URL=https://github.com/${{ github.repository }}/releases/download/$TAG/$ASSET" >> "$GITHUB_ENV"

      - name: Update apps.json
        run: python3 scripts/update_source.py app.ipa "$URL" notes.txt

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps.json
          git diff --cached --quiet || git commit -m "Add ${{ github.event.release.tag_name || inputs.tag }} to source"
          git push
